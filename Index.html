<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio web Avanzado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Bienvenidos a Mi Sitio</h1>
            <button id="theme-toggle">Cambiar Tema</button>
        </header>

        <main>
            <section class="about">
                <h2>Sobre mí</h2>
                <p>Mi nombre es Juan Gilberto Torres Mar y tengo estos conocimientos para dar servicios</p>
            </section>

            <section class="services">
                <h2>Conocimientos</h2>
                <div class="service-buttons">
                    <button class="service-btn">Diseño Web con html y css</button>
                    <button class="service-btn">Desarrollo Backend</button>
                    <button class="service-btn">Desarrollo .NET</button>
                </div>
            </section>

            <section class="contact">
                <h2>Contacto</h2>
                <form id="contact-form">
                    <input type="text" placeholder="Tu nombre" required>
                    <input type="email" placeholder="Tu correo" required>
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
